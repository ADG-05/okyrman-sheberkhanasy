        // ==========================================
        // 2. SOUND ENGINE (TONE.JS)
        // ==========================================
        let soundEnabled = true;
        let musicPlaying = false;
        let ambientLoop = null;

        async function playSound(type) {
            if (!soundEnabled || typeof Tone === 'undefined') return;
            try {
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -10;
                if (type === 'click') {
                    synth.triggerAttackRelease("C5", "32n");
                } else if (type === 'page') {
                    synth.triggerAttackRelease(["E4", "G4"], "16n");
                } else if (type === 'success') {
                    synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
                } else if (type === 'levelup') {
                    synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n");
                } else if (type === 'error') {
                    synth.triggerAttackRelease(["D3", "C3"], "8n");
                }
            } catch (e) { /* Audio blocked before user interaction */ }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            icon.className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute text-rose-400';
            showToast(soundEnabled ? 'Дыбыс эффектілері қосылды' : 'Дыбыс эффектілері өшірілді', 'info');
        }

        async function toggleAmbientMusic() {
            if (typeof Tone === 'undefined') return;
            if (Tone.context.state !== 'running') await Tone.start();
            const btn = document.getElementById('music-toggle-btn');

            if (!musicPlaying) {
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 1.5, decay: 1, sustain: 0.4, release: 2 }
                }).toDestination();
                synth.volume.value = -20;

                const chords = [
                    ["D4", "F4", "A4"],
                    ["C4", "E4", "G4"],
                    ["Bb3", "D4", "F4"],
                    ["A3", "C4", "E4"]
                ];
                let idx = 0;
                ambientLoop = new Tone.Loop(time => {
                    synth.triggerAttackRelease(chords[idx % chords.length], "2n", time);
                    idx++;
                }, "2m").start(0);
                Tone.Transport.start();
                musicPlaying = true;
                btn.classList.add('border-gold-400', 'bg-royal-700');
                showToast('Сиқырлы кітапхана әуені қосылды 🎵', 'info');
            } else {
                if (ambientLoop) ambientLoop.stop();
                Tone.Transport.stop();
                musicPlaying = false;
                btn.classList.remove('border-gold-400', 'bg-royal-700');
                showToast('Фондық әуен өшірілді', 'info');
            }
        }

        let DB = loadDB();

        function saveDB() {
            SafeStorage.setItem(STORAGE_KEY, JSON.stringify(DB));

        function getActiveStudent() {
            if (!DB.currentUser || DB.currentUser.role !== 'student') return null;
            return DB.students.find(s => s.id === DB.currentUser.id) || null;
        }

        function getLevelInfo(points) {
            let current = LEVELS[0];
            let next = LEVELS[1];
            for (let i = 0; i < LEVELS.length; i++) {
                if (points >= LEVELS[i].min) {
                    current = LEVELS[i];
                    next = LEVELS[i + 1] || null;
                }
            }
            const progressPercent = next
                ? Math.min(100, Math.round(((points - current.min) / (next.min - current.min)) * 100))
                : 100;
            return { current, next, progressPercent };
        }

        function awardPoints(student, amount, reason) {
            if (!student) return;
            const prevLevel = getLevelInfo(student.points).current.level;
            student.points += amount;
            student.lastActive = new Date().toISOString().split('T')[0];

            // Check automatic achievements
            if (student.booksRead.length >= 1 && !student.achievements.includes('first_book')) student.achievements.push('first_book');
            if (student.booksRead.length >= 5 && !student.achievements.includes('five_books')) student.achievements.push('five_books');
            if (student.booksRead.length >= 10 && !student.achievements.includes('ten_books')) student.achievements.push('ten_books');
            if (student.completedStages.length >= 7 && !student.achievements.includes('top_researcher')) student.achievements.push('top_researcher');
            if (student.litCourtSubmissions.length >= 1 && !student.achievements.includes('top_analyst')) student.achievements.push('top_analyst');
            if (student.creativeWorks.length >= 1 && !student.achievements.includes('creative_reader')) student.achievements.push('creative_reader');
            if (student.detectiveCompleted.length >= 4 && !student.achievements.includes('weekly_best')) student.achievements.push('weekly_best');

            saveDB();
            playSound('success');
            showToast(`+${amount} ${t('points')} (${reason})`, 'success');

            const newLevelInfo = getLevelInfo(student.points);
            if (newLevelInfo.current.level > prevLevel) {
                setTimeout(() => {
                    playSound('levelup');
                    showToast(`🎉 Жаңа деңгей ашылды: ${newLevelInfo.current.icon} ${newLevelInfo.current.title}!`, 'gold');
                }, 600);
            }
            updateSidebarSummary();
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-800 border-emerald-400 text-white',
                gold: 'bg-gradient-to-r from-amber-600 to-yellow-600 border-yellow-300 text-royal-950 font-bold',
                error: 'bg-rose-800 border-rose-400 text-white',
                info: 'bg-royal-800 border-gold-400 text-amber-50'
            };
            toast.className = `pointer-events-auto p-3.5 rounded-2xl border shadow-xl text-sm flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'gold' ? 'fa-crown' : type === 'error' ? 'fa-exclamation-circle' : 'fa-sparkles'}"></i><span>${msg}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3400);
        }

        function switchAuthTab(tab) {
            ['student', 'register', 'teacher'].forEach(tName => {
                document.getElementById(`form-${tName}`).classList.toggle('hidden', tName !== tab);
                const btn = document.getElementById(`tab-${tName}`);
                if (tName === tab) {
                    btn.className = `py-2 rounded-xl text-xs sm:text-sm font-bold transition ${tab === 'teacher' ? 'bg-mystic-600 text-white shadow' : 'bg-royal-900 text-gold-400 shadow'}`;
                } else {
                    btn.className = "py-2 rounded-xl text-xs sm:text-sm font-bold transition text-slate-700";
                }
            });
        }

        function quickDemoLogin(role, loginId) {
            if (role === 'teacher') {
                DB.currentUser = { id: DB.teacher.id, role: 'teacher' };
                saveDB();
                closeModal();
                playSound('success');
                showToast(`Қош келдіңіз, ${DB.teacher.name}!`, "success");
                initWorkspace();
                navigateTo('teacher_dash');
            } else {
                const st = DB.students.find(s => s.login === loginId) || DB.students[0];
                if (st) {
                    DB.currentUser = { id: st.id, role: 'student' };
                    saveDB();
                    closeModal();
                    playSound('success');
                    showToast(`Қош келдің, ${st.name}!`, "success");
                    initWorkspace();
                }
            }
        }

        function handleStudentLogin(e) {
            e.preventDefault();
            const login = document.getElementById('st-login').value.trim().toLowerCase();
            const pass = document.getElementById('st-pass').value.trim();
            const found = DB.students.find(s => s.login.toLowerCase() === login && s.password === pass);
            if (!found) {
                playSound('error');
                showToast("Логин немесе құпиясөз қате!", "error");
                return;
            }
            DB.currentUser = { id: found.id, role: 'student' };
            saveDB();
            closeModal();
            playSound('success');
            showToast(`Қош келдің, ${found.name}!`, "success");
            initWorkspace();
        }

        function handleStudentRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const grade = document.getElementById('reg-grade').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            const login = document.getElementById('reg-login').value.trim().toLowerCase();
            const password = document.getElementById('reg-pass').value.trim();
            const avatar = document.getElementById('reg-avatar').value;

            if (DB.students.some(s => s.login.toLowerCase() === login)) {
                showToast("Бұл логин бос емес, басқа логин таңдаңыз.", "error");
                return;
            }

            const newStudent = {
                id: 'st_' + Date.now(),
                name, grade, school, login, password, avatar,
                points: 10,
                booksRead: [],
                completedStages: [],
                stageAnswers: {},
                detectiveCompleted: [],
                litCourtSubmissions: [],
                creativeWorks: [],
                audioLogs: [],
                achievements: [],
                galleryApproved: false,
                lastActive: new Date().toISOString().split('T')[0]
            };
            DB.students.push(newStudent);
            DB.currentUser = { id: newStudent.id, role: 'student' };
            saveDB();
            closeModal();
            playSound('levelup');
            showToast(`Тіркелу сәтті аяқталды! +10 бастапқы ұпай берілді!`, "gold");
            initWorkspace();
        }

        function handleTeacherLogin(e) {
            e.preventDefault();
            const login = document.getElementById('t-login').value.trim();
            const pass = document.getElementById('t-pass').value.trim();
            if (login === DB.teacher.login && pass === DB.teacher.password) {
                DB.currentUser = { id: DB.teacher.id, role: 'teacher' };
                saveDB();
                closeModal();
                playSound('success');
                showToast(`Қош келдіңіз, ${DB.teacher.name}!`, "success");
                initWorkspace();
                navigateTo('teacher_dash');
            } else {
                playSound('error');
                showToast("Мұғалім деректері қате!", "error");
            }
        }

        function logout() {
            DB.currentUser = null;
            saveDB();
            playSound('click');
            showToast("Жүйеден шықтыңыз", "info");
            initWorkspace();
            navigateTo('home');
        }

        function initWorkspace() {
            renderHeaderUser();
            updateSidebarSummary();
            renderNavigation();
            if (DB.currentUser?.role === 'student' && currentRoute === 'home') {
                navigateTo('student_dash', true);
            } else {
                navigateTo(currentRoute, true);
            }
        }

        // ==========================================
        // 7. ROUTER & VIEW RENDERERS
        // ==========================================
        function navigateTo(route, silent = false) {
            currentRoute = route;
            if (!silent) playSound('click');
            renderNavigation();
            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            switch (route) {
                case 'home': renderHome(main); break;
                case 'student_dash': renderStudentDashboard(main); break;
                case 'oqyrman': renderOqyrmanModel(main); break;
                case 'book_secret': renderBookSecret(main); break;
                case 'detective': renderDetectiveGame(main); break;
                case 'lit_court': renderLitCourt(main); break;
                case 'creative': renderCreativeLab(main); break;
                case 'audio': renderAudioStudio(main); break;
                case 'ai_mentor': renderAiMentor(main); break;
                case 'figures': renderGreatFigures(main); break;
                case 'passport': renderReaderPassport(main); break;
                case 'gallery': renderTopGallery(main); break;
                case 'teacher_dash': renderTeacherDashboard(main); break;
                case 'students_manage': renderStudentsManage(main); break;
                case 'lesson10': renderLesson10Min(main); break;
                default: renderHome(main);
            }
        }

        // ------------------------------------------
        // VIEW 3: 7-STAGE "OQYRMAN" MODEL
        // ------------------------------------------
        let selectedStageIdx = 0;

        function renderOqyrmanModel(container) {
            const st = getActiveStudent();
            const stage = OQYRMAN_STAGES[selectedStageIdx];
            const isCompleted = st ? st.completedStages.includes(selectedStageIdx) : false;
            const isUnlocked = !st ? true : (selectedStageIdx === 0 || st.completedStages.includes(selectedStageIdx - 1) || isCompleted);
            const savedAnswer = st?.stageAnswers?.[selectedStageIdx] || '';

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl border border-parchment-300 shadow-sm">
                        <h2 class="font-serif text-2xl font-bold text-royal-900">«ОҚЫРМАН» – 7 кезеңдік әдістемелік модель</h2>
                        <p class="text-sm text-slate-600 mt-1">Әр кезеңді ретімен орындап, келесі деңгейдің құлпын ашыңыз.</p>

                        <!-- 7 Stage Stepper -->
                        <div class="grid grid-cols-7 gap-2 mt-5">
                            ${OQYRMAN_STAGES.map((s, idx) => {
                                const done = st?.completedStages.includes(idx);
                                const unlocked = !st || idx === 0 || st.completedStages.includes(idx - 1) || done;
                                const active = idx === selectedStageIdx;
                                return `
                                    <button onclick="selectStage(${idx})"
                                        class="p-2.5 sm:p-3 rounded-2xl border text-center transition flex flex-col items-center justify-center ${
                                            active
                                                ? 'bg-royal-900 text-gold-400 border-gold-500 shadow-lg scale-105'
                                                : done
                                                    ? 'bg-emerald-50 text-emerald-800 border-emerald-400'
                                                    : unlocked
                                                        ? 'bg-parchment-100 text-royal-900 border-parchment-300 hover:border-gold-400'
                                                        : 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed'
                                        }">
                                        <span class="font-serif font-extrabold text-lg sm:text-xl">${s.letter}</span>
                                        <span class="text-[10px] mt-0.5 hidden sm:block truncate w-full">${s.title}</span>
                                        <span class="text-[10px] mt-1">${done ? '✅' : unlocked ? '🔓' : '🔒'}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Active Stage Workspace -->
                    <div class="bg-white p-6 sm:p-8 rounded-3xl border-2 border-gold-500/40 shadow-md">
                        ${!isUnlocked ? `
                            <div class="text-center py-10">
                                <div class="text-5xl mb-3">🔒</div>
                                <h3 class="font-serif text-xl font-bold text-royal-900">Бұл кезең әлі жабық</h3>
                                <p class="text-sm text-slate-600 mt-1">Алдымен ${selectedStageIdx}-кезеңді («${OQYRMAN_STAGES[selectedStageIdx - 1].title}») орындаңыз.</p>
                            </div>
                        ` : `
                            <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-parchment-200">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-2xl bg-royal-900 text-gold-400 font-serif font-extrabold text-2xl flex items-center justify-center shadow">
                                        ${stage.letter}
                                    </div>
                                    <div>
                                        <h3 class="font-serif text-xl font-bold text-royal-900">${selectedStageIdx + 1}-кезең: ${stage.title}</h3>
                                        <p class="text-xs text-slate-500">${stage.subtitle}</p>
                                    </div>
                                </div>
                                <span class="px-3.5 py-1.5 rounded-xl bg-amber-100 text-amber-800 font-bold text-xs border border-amber-300">
                                    Марапат: +${stage.points} ұпай
                                </span>
                            </div>

                            ${stage.storyText ? `
                                <div class="my-5 p-5 rounded-2xl bg-parchment-100 border-l-4 border-gold-500">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold text-wood-800 uppercase tracking-wider">Мәтін үзіндісі («Әке мен бала»)</span>
                                        <button onclick="speakText(\`${stage.storyText}\`)" class="px-3 py-1 rounded-lg bg-royal-900 text-gold-400 text-xs font-semibold hover:bg-royal-800 transition">
                                            <i class="fas fa-volume-up mr-1"></i> Дыбыстап тыңдау
                                        </button>
                                    </div>
                                    <p class="text-sm text-slate-800 leading-relaxed">${stage.storyText}</p>
                                </div>
                            ` : ''}

                            <div class="my-5">
                                <h4 class="text-sm font-bold text-royal-900 mb-2"><i class="fas fa-tasks text-gold-600 mr-1.5"></i> Тапсырма нұсқаулығы:</h4>
                                <p class="text-sm text-slate-700 bg-blue-50/60 p-4 rounded-2xl border border-blue-200">${stage.instruction}</p>
                            </div>

                            <form onsubmit="submitOqyrmanStage(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Сенің жауабың:</label>
                                    <textarea id="oqyrman-answer-input" rows="4" required placeholder="${stage.promptPlaceholder}"
                                        class="w-full p-4 rounded-2xl border border-parchment-300 bg-parchment-50 focus:bg-white focus:outline-none focus:border-gold-500 text-sm">${savedAnswer}</textarea>
                                </div>

                                <div class="flex flex-wrap items-center justify-between gap-3">
                                    <button type="button" onclick="showToast('Кеңес: ${stage.sampleHint}', 'info')" class="px-4 py-2 rounded-xl bg-parchment-200 hover:bg-parchment-300 text-slate-800 text-xs font-bold transition">
                                        <i class="fas fa-lightbulb text-gold-600 mr-1"></i> Бағыттаушы кеңес
                                    </button>
                                    <button type="submit" class="px-6 py-3 rounded-xl bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 hover:to-gold-500 text-royal-950 font-bold text-sm shadow-md transition">
                                        <i class="fas fa-check-circle mr-1.5"></i> ${isCompleted ? 'Жауапты жаңарту' : 'Тексеру және ұпай алу'}
                                    </button>
                                </div>
                            </form>
                        `}
                    </div>
                </div>
            `;
        }

        function selectStage(idx) {
            const st = getActiveStudent();
            const isCompleted = st ? st.completedStages.includes(idx) : false;
            const isUnlocked = !st ? true : (idx === 0 || st.completedStages.includes(idx - 1) || isCompleted);
            if (!isUnlocked) {
                playSound('error');
                showToast("Алдымен алдыңғы кезеңді аяқтаңыз!", "error");
                return;
            }
            selectedStageIdx = idx;
            playSound('page');
            renderOqyrmanModel(document.getElementById('main-content'));
        }

        function submitOqyrmanStage(e) {
            e.preventDefault();
            const st = getActiveStudent();
            if (!st) {
                openAuthModal('student');
                showToast("Ұпай жинау үшін оқушы ретінде кіріңіз!", "info");
                return;
            }
            const textAns = document.getElementById('oqyrman-answer-input').value.trim();
            if (textAns.length < 5) {
                showToast("Толығырақ жауап жазыңыз (кемінде 5 таңба).", "error");
                return;
            }

            const stage = OQYRMAN_STAGES[selectedStageIdx];
            const alreadyDone = st.completedStages.includes(selectedStageIdx);
            st.stageAnswers[selectedStageIdx] = textAns;
            if (!alreadyDone) {
                st.completedStages.push(selectedStageIdx);
                awardPoints(st, stage.points, `«${stage.letter} – ${stage.title}» кезеңі`);
            } else {
                saveDB();
                showToast(t('savedSuccess'), 'success');
            }

            if (selectedStageIdx < OQYRMAN_STAGES.length - 1) {
                selectedStageIdx++;
            }
            renderOqyrmanModel(document.getElementById('main-content'));
        }

                    <div class="bg-white p-6 sm:p-8 rounded-3xl border border-parchment-300 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h2 class="font-serif text-2xl font-bold text-royal-900">🔮 Кітаптың құпиясы — Зерттеу парағы</h2>

                            </div>

                        <form onsubmit="saveBookSecret(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">

                                <select id="bs-cover" class="w-full px-4 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50">
                                    <option value="📘">📘 Көк мұқаба (Классика)</option>

                                <textarea id="bs-summary" rows="3" placeholder="Кітап не туралы?" required class="w-full p-3.5 rounded-xl border border-parchment-300 bg-parchment-50"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Негізгі идеясы</label>
                                <input type="text" id="bs-idea" placeholder="Автор не айтқысы келді?" required class="w-full px-4 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Ең ұнаған үзінді (дәйексөз)</label>
                                <input type="text" id="bs-quote" placeholder="Кітаптан әсерлі сөйлем..." required class="w-full px-4 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-slate-700 mb-1">Кітаптан алған әсерім</label>
                                <textarea id="bs-impression" rows="2" placeholder="Бұл кітап саған қалай әсер етті?" required class="w-full p-3.5 rounded-xl border border-parchment-300 bg-parchment-50"></textarea>
                            </div>

        // ------------------------------------------
        // VIEW 5: DETECTIVE READER GAME (ДЕТЕКТИВ ОҚЫРМАН)
        // ------------------------------------------
        let detectiveTimer = null;

        function renderDetectiveGame(container) {
            if (detectiveTimer) clearInterval(detectiveTimer);
            detectiveSeconds = 0;
            const st = getActiveStudent();
            const q = DETECTIVE_GAMES[currentDetectiveIdx];

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="kazakh-pattern rounded-3xl p-6 text-white border border-gold-500/40 flex flex-wrap items-center justify-between gap-4">

                        </div>
                        <div class="flex items-center gap-3">

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    lastAudioUrl = URL.createObjectURL(blob);
                    const player = document.getElementById('recorded-audio-player');
                    player.src = lastAudioUrl;
                    document.getElementById('audio-playback-area').classList.remove('hidden');
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                document.getElementById('rec-status').innerHTML = '<span class="text-rose-400 font-bold animate-pulse">● Жазылуда... Мәтінді мәнерлеп оқыңыз!</span>';
                document.getElementById('btn-rec-start').disabled = true;
                document.getElementById('btn-rec-stop').disabled = false;
            } catch (err) {
                showToast("Микрофонға рұқсат берілмеді немесе құрылғы табылмады.", "error");
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {

        function handleAiForm(e) {
            e.preventDefault();
            const inp = document.getElementById('ai-user-input');
            const val = inp.value.trim();
            if (!val) return;
            inp.value = '';
            sendAiPrompt(val);
        }

        function sendAiPrompt(userText) {
            aiChatHistory.push({ sender: 'user', text: userText });

            // Socratic guiding response (never gives away direct exam answers immediately)
            let reply = "";
            const low = userText.toLowerCase();
            if (low.includes('сөз') || low.includes('мағына')) {
                reply = "🔍 <b>Сөздік зерттеуі:</b> «Ғақлия» — терең ойлы, даналық сөз деген мағына береді. Ал сен бұл сөзді қай шығармадан кездестірдің? Сол сөйлемді өз сөзіңмен қалай жеткізер едің?";
            } else if (low.includes('қожа')) {
                reply = "🤔 <b>Ойландыратын сұрақ:</b> Қожа құпия кеңес ашқан кезде өзіне қандай уәде берді? Сенің ойыңша, адам өз мінезін түзету үшін ең алдымен не істеуі керек?";
            } else if (low.includes('эссе') || low.includes('идея')) {
                reply = "✍️ <b>Шығармашылық бағыт:</b> Жақсы эссе 3 бөлімнен тұрады: 1) Кіріспе (негізгі сұрақ), 2) Негізгі бөлім (кітаптан 2 дәлел), 3) Қорытынды. Сен қай кейіпкер туралы жазғың келеді? Алдымен бірінші сөйлемін жазып көрші, мен бағыт беремін!";
            } else {
                reply = "💡 Өте қызықты ой! Мен саған дайын жауап бермес бұрын мына сұраққа жауап беріп көрші: <b>Бұл оқиғада кейіпкердің басты мақсаты не болды және оның әрекеті кімге әсер етті?</b> Жауабыңды жаз, бірге талдайық!";
            }

            aiChatHistory.push({ sender: 'ai', text: reply });
            playSound('page');
            renderAiMentor(document.getElementById('main-content'));
        }

            const list = DB.students
                .filter(s => s.name.toLowerCase().includes(query) || s.grade.toLowerCase().includes(query))
                .sort((a, b) => sortDir === 'desc' ? b.points - a.points : a.points - b.points);

            tbody.innerHTML = list.map(s => {
                const lvl = getLevelInfo(s.points);
                return `
                    <tr class="border-b border-parchment-200 hover:bg-parchment-100">
                        <td class="py-3 px-2 font-bold text-royal-900">${s.avatar} ${s.name}</td>
                        <td class="py-3 px-2">${s.grade}</td>
                        <td class="py-3 px-2">${s.booksRead.length}</td>
                        <td class="py-3 px-2">${s.completedStages.length}/7</td>
                        <td class="py-3 px-2 font-extrabold text-gold-600">${s.points}</td>
                        <td class="py-3 px-2 text-xs">${lvl.current.icon} ${lvl.current.title}</td>
                        <td class="py-3 px-2">
                            <button onclick="openStudentDetailModal('${s.id}')" class="px-3 py-1 rounded-lg bg-royal-900 text-gold-400 text-xs font-bold hover:bg-royal-800">
                                Тексеру / Бағалау
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function initTeacherCharts() {
            teacherCharts.forEach(c => c.destroy());
            teacherCharts = [];
            if (typeof Chart === 'undefined') return;

            const ctx1 = document.getElementById('chart-points');
            if (ctx1) {
                teacherCharts.push(new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: DB.students.map(s => s.name.split(' ')[0]),
                        datasets: [{
                            label: 'Жинаған ұпай',
                            data: DB.students.map(s => s.points),
                            backgroundColor: '#d97706',
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                }));
            }

            const ctx2 = document.getElementById('chart-stages');
            if (ctx2) {
                const stageCounts = OQYRMAN_STAGES.map((_, idx) =>
                    DB.students.filter(s => s.completedStages.includes(idx)).length
                );
                teacherCharts.push(new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: OQYRMAN_STAGES.map(s => `${s.letter} (${s.title})`),
                        datasets: [{
                            label: 'Аяқтаған оқушылар саны',
                            data: stageCounts,
                            borderColor: '#1b2e63',
                            backgroundColor: 'rgba(27, 46, 99, 0.15)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                }));
            }
        }

        function openStudentDetailModal(stId) {
            const st = DB.students.find(s => s.id === stId);
            if (!st) return;
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-serif text-xl font-bold text-royal-900">${st.avatar} ${st.name} (${st.grade})</h3>
                    <div class="grid grid-cols-2 gap-3 text-xs bg-parchment-100 p-3.5 rounded-2xl">
                        <p><b>Логин:</b> ${st.login}</p>
                        <p><b>Құпиясөз:</b> ${st.password}</p>
                        <p><b>Оқылған кітап:</b> ${st.booksRead.length}</p>
                        <p><b>ОҚЫРМАН кезеңі:</b> ${st.completedStages.length}/7</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Ұпайды түзету / Қосымша бағалау:</label>
                        <div class="flex gap-2">
                            <input type="number" id="modal-edit-points" value="${st.points}" class="px-3 py-2 rounded-xl border border-parchment-300 w-32 font-bold">
                            <button onclick="updateStudentPointsFromTeacher('${st.id}')" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Ұпайды сақтау</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-3 rounded-xl bg-amber-50 border border-gold-400/50">
                        <span class="text-xs font-bold text-royal-900">«Үздік оқырмандар» галереясында жариялау:</span>
                        <input type="checkbox" ${st.galleryApproved ? 'checked' : ''} onchange="toggleGalleryApproval('${st.id}', this.checked)" class="w-5 h-5 accent-gold-600">
                    </div>

                    <div class="max-h-48 overflow-y-auto space-y-2 text-xs">
                        <p class="font-bold text-royal-900">Орындалған жауаптар:</p>
                        ${Object.entries(st.stageAnswers).map(([k, v]) => `
                            <div class="p-2.5 rounded-xl bg-white border border-parchment-300">
                                <b>${OQYRMAN_STAGES[k]?.letter} – ${OQYRMAN_STAGES[k]?.title}:</b> ${v}
                            </div>
                        `).join('') || '<p class="text-slate-500">Жауаптар әлі жоқ.</p>'}
                    </div>
                </div>
            `);
        }

        function updateStudentPointsFromTeacher(stId) {
            const st = DB.students.find(s => s.id === stId);
            const val = parseInt(document.getElementById('modal-edit-points').value);
            if (st && !isNaN(val)) {
                st.points = Math.max(0, val);
                saveDB();
                showToast("Оқушы ұпайы жаңартылды!", "success");
                renderTeacherDashboard(document.getElementById('main-content'));
            }
        }

        function toggleGalleryApproval(stId, approved) {
            const st = DB.students.find(s => s.id === stId);
            if (st) {
                st.galleryApproved = approved;
                saveDB();
                showToast(approved ? "Галереяда жариялауға рұқсат берілді" : "Галереядан алынып тасталды", "info");
            }
        }

        function exportTeacherCSV() {
            let csv = "\uFEFFАты-жөні,Сыныбы,Мектеп,Оқылған кітап,Аяқталған кезең,Жинаған ұпай,Деңгей\n";
            DB.students.forEach(s => {
                const lvl = getLevelInfo(s.points).current.title;
                csv += `"${s.name}","${s.grade}","${s.school}",${s.booksRead.length},${s.completedStages.length},${s.points},"${lvl}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oqyrman_esep_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showToast("Excel (CSV) есебі жүктелді!", "success");
        }

        // ------------------------------------------
        // VIEW 14: MANAGE STUDENTS (ОҚУШЫЛАРДЫ БАСҚАРУ)
        // ------------------------------------------
        function renderStudentsManage(container) {
            if (DB.currentUser?.role !== 'teacher') {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-3xl"><p>${t('teacherOnly')}</p></div>`;
                return;
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl border border-parchment-300 shadow-sm">
                        <h2 class="font-serif text-2xl font-bold text-royal-900">👩‍🏫 Оқушылар мен сыныптарды басқару</h2>
                        <p class="text-sm text-slate-600 mt-1">Жаңа оқушы тіркеу, логин/құпиясөз беру және тізімді өңдеу.</p>

                        <form onsubmit="teacherAddStudent(event)" class="mt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                            <input type="text" id="t-add-name" placeholder="Оқушы аты-жөні" required class="px-3.5 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50 text-xs">
                            <input type="text" id="t-add-grade" placeholder="Сыныбы (7 «Б»)" required class="px-3.5 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50 text-xs">
                            <input type="text" id="t-add-login" placeholder="Логин" required class="px-3.5 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50 text-xs">
                            <input type="text" id="t-add-pass" placeholder="Құпиясөз" required class="px-3.5 py-2.5 rounded-xl border border-parchment-300 bg-parchment-50 text-xs">
                            <button type="submit" class="px-4 py-2.5 rounded-xl bg-royal-900 text-gold-400 font-bold text-xs shadow hover:bg-royal-800 transition">
                                + Оқушы қосу
                            </button>
                        </form>
                    </div>

                    <div class="bg-white p-6 rounded-3xl border border-parchment-300 shadow-sm space-y-3">
                        ${DB.students.map(s => `
                            <div class="p-4 rounded-2xl bg-parchment-100 border border-parchment-300 flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <p class="font-bold text-sm text-royal-900">${s.avatar} ${s.name} <span class="text-xs font-normal text-slate-600">(${s.grade})</span></p>
                                    <p class="text-xs text-slate-600">Логин: <b>${s.login}</b> • Құпиясөз: <b>${s.password}</b> • Ұпай: <b>${s.points}</b></p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="openStudentDetailModal('${s.id}')" class="px-3 py-1.5 rounded-xl bg-white border border-parchment-300 text-xs font-bold text-royal-900">Өңдеу</button>
                                    <button onclick="teacherDeleteStudent('${s.id}')" class="px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 text-xs font-bold hover:bg-rose-200">Өшіру</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function teacherAddStudent(e) {
            e.preventDefault();
            const name = document.getElementById('t-add-name').value.trim();
            const grade = document.getElementById('t-add-grade').value.trim();
            const login = document.getElementById('t-add-login').value.trim().toLowerCase();
            const password = document.getElementById('t-add-pass').value.trim();

            if (DB.students.some(s => s.login.toLowerCase() === login)) {
                showToast("Бұл логин тіркелген!", "error");
                return;
            }
            DB.students.push({
                id: 'st_' + Date.now(),
                name, grade, school: DB.teacher.school, login, password,
                avatar: '🧑🏻', points: 0, booksRead: [], completedStages: [], stageAnswers: {},
                detectiveCompleted: [], litCourtSubmissions: [], creativeWorks: [], audioLogs: [],
                achievements: [], galleryApproved: false, lastActive: new Date().toISOString().split('T')[0]
            });
            saveDB();
            showToast(`${name} тізімге қосылды!`, "success");
            renderStudentsManage(document.getElementById('main-content'));
        }

        function teacherDeleteStudent(stId) {
            DB.students = DB.students.filter(s => s.id !== stId);
            saveDB();
            showToast("Оқушы тізімнен өшірілді", "info");
            renderStudentsManage(document.getElementById('main-content'));
        }

        // ------------------------------------------
        // VIEW 15: 10-MINUTE LESSON MODE (10 МИНУТТЫҚ САБАҚ)
        // ------------------------------------------
        let lesson10Interval = null;
        let lesson10Remaining = 600;

        function renderLesson10Min(container) {
            if (lesson10Interval) clearInterval(lesson10Interval);
            const blocks = [
                { min: '1 минут', title: 'Қызығушылық ояту', task: 'Тақтадағы жұмбақ сурет бойынша шығарма тақырыбын болжау.' },
                { min: '2 минут', title: 'Мәтінді оқу', task: 'Ыбырай Алтынсариннің «Әке мен бала» әңгімесін рөлге бөліп оқу.' },
                { min: '2 минут', title: 'Ақпаратты табу', task: 'Мәтіннен баланың әрекетін сипаттайтын 3 тірек сөзді табу.' },
                { min: '3 минут', title: 'Интерактивті тапсырма', task: '«Детектив оқырман» бөліміндегі 3 сұраққа сынып болып жауап беру.' },
                { min: '1 минут', title: 'Қорытынды', task: 'Әңгіменің басты түйінін бір мақалмен жеткізу.' },
                { min: '1 минут', title: 'Рефлексия', task: 'Бүгінгі сабақтан алған әсерді белгілеп, ұпайларды тіркеу.' }
            ];

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="kazakh-pattern rounded-3xl p-6 text-white border border-gold-500/50 flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 class="font-serif text-2xl font-bold text-gold-400">⏱️ «10 минуттық сабақ» жедел режимі</h2>
                            <p class="text-xs sm:text-sm text-amber-100/80">Сабақ үстінде интерактивті тақтада қолдануға арналған таймерлі құрылым.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="px-5 py-2.5 rounded-2xl bg-royal-950 border border-gold-400 text-2xl font-extrabold text-gold-400" id="l10-timer">
                                10:00
                            </div>
                            <button onclick="startLesson10Timer()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">
                                <i class="fas fa-play"></i> Бастау
                            </button>
                            <button onclick="resetLesson10Timer()" class="px-3 py-2.5 rounded-xl bg-royal-800 text-amber-200 text-xs font-bold">
                                <i class="fas fa-redo"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${blocks.map((b, i) => `
                            <div class="bg-white p-5 rounded-3xl border border-parchment-300 shadow-sm">
                                <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">${i + 1}. ${b.min}</span>
                                <h3 class="font-bold text-royal-900 text-base mt-3">${b.title}</h3>
                                <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${b.task}</p>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-parchment-300 flex flex-wrap items-center justify-between gap-3">
                        <p class="text-sm font-semibold text-royal-900">Сабақ соңында барлық белсенді оқушыларға +15 бонус ұпай беру:</p>
                        <button onclick="awardClassBonus()" class="px-5 py-2.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-royal-950 font-bold text-xs shadow transition">
                            🎉 Сыныпқа +15 ұпай тіркеу
                        </button>
                    </div>
                </div>
            `;
        }

        function startLesson10Timer() {
            if (lesson10Interval) clearInterval(lesson10Interval);
            lesson10Interval = setInterval(() => {
                if (lesson10Remaining <= 0) {
                    clearInterval(lesson10Interval);
                    playSound('levelup');
                    showToast("10 минуттық сабақ аяқталды!", "gold");
                    return;
                }
                lesson10Remaining--;
                const el = document.getElementById('l10-timer');
                if (el) {
                    const m = String(Math.floor(lesson10Remaining / 60)).padStart(2, '0');
                    const s = String(lesson10Remaining % 60).padStart(2, '0');
                    el.textContent = `${m}:${s}`;
                } else {
                    clearInterval(lesson10Interval);
                }
            }, 1000);
        }

        function resetLesson10Timer() {
            if (lesson10Interval) clearInterval(lesson10Interval);
            lesson10Remaining = 600;
            const el = document.getElementById('l10-timer');
            if (el) el.textContent = "10:00";
        }

        function awardClassBonus() {
            DB.students.forEach(s => s.points += 15);
            saveDB();
            playSound('levelup');
            showToast("Барлық оқушыларға 10 минуттық сабақ үшін +15 ұпай тіркелді!", "gold");
        }

        // ==========================================
        // 8. INITIALIZATION & NETWORK MONITOR
        // ==========================================
        window.addEventListener('online', () => {
            document.getElementById('network-text').textContent = t('onlineMode');
        });
        window.addEventListener('offline', () => {
            document.getElementById('network-text').textContent = t('offlineMode');
        });

        window.onload = function() {
            setLanguage(DB.lang || 'kk');
            initWorkspace();
        };
    </script>
</body>
</html>
